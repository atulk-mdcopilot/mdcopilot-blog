name: mdcopilot-blog

x-backend: &backend
  image: mdcopilot-blog-backend:runtime
  build:
    context: ./backend
    target: runtime
  env_file: .env
  environment:
    # The mdcopilot-backend database (same URL the root docker-compose.yml gives backend and drive).
    # Blog tables are blog_*, Alembic history is blog_alembic_versions, DBOS uses schema blog_dbos.
    DATABASE_URL: postgresql://mdcopilot_user:mdcopilot_pass@postgres:5432/mdcopilot
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # No database service: start the root stack (../docker-compose.yml) first; its postgres is the database.
  migrate:
    <<: *backend
    command: [python, -m, mdcopilot_blog.cli, migrate]
    restart: "no"

  api:
    <<: *backend
    command: [uvicorn, --factory, mdcopilot_blog.api.app:create_app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8300}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *backend
    command: [python, -m, mdcopilot_blog.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    image: mdcopilot-blog-web:prod
    build:
      context: ./frontend
      target: prod
    environment:
      PUBLIC_PROXY_SCHEME: "${PUBLIC_PROXY_SCHEME:-http}"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8310}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# Join the root stack network (project "mdcopilot") so "postgres" resolves to the backend database.
networks:
  default:
    name: mdcopilot_mdcopilot-network
    external: true
