name: mdcopilot-blog

x-backend: &backend
  image: mdcopilot-blog-backend:runtime
  build:
    context: ./backend
    target: runtime
  env_file: .env
  environment:
    POSTGRES_HOST: db
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-mdcopilot_blog}"
      POSTGRES_USER: "${POSTGRES_USER:-mdcopilot_blog}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5440}:5432"
    volumes:
      - blog_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    <<: *backend
    command: [python, -m, mdcopilot_blog.cli, migrate]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: [uvicorn, --factory, mdcopilot_blog.api.app:create_app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8300}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *backend
    command: [python, -m, mdcopilot_blog.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    image: mdcopilot-blog-web:prod
    build:
      context: ./frontend
      target: prod
    environment:
      PUBLIC_PROXY_SCHEME: "${PUBLIC_PROXY_SCHEME:-http}"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8310}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  blog_pgdata: {}
