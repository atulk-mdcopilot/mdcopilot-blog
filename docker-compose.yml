name: mdcopilot-blog

x-backend: &backend
  image: mdcopilot-blog-backend:runtime
  build:
    context: ./backend
    target: runtime
  env_file: .env
  environment:
    # The mdcopilot-backend database (same URL the root docker-compose.yml gives backend and drive).
    # Blog tables are blog_*, Alembic history is blog_alembic_versions, DBOS uses schema blog_dbos.
    DATABASE_URL: postgresql://mdcopilot_user:mdcopilot_pass@postgres:5432/mdcopilot
    # Service-to-service auth, development values (they match the root docker-compose.yml backend service).
    BLOG_INTERNAL_TOKEN: local-dev-blog-token
    BACKEND_INTERNAL_URL: http://backend:8000
    BACKEND_INTERNAL_TOKEN: local-dev-internal-token

services:
  # No database service: start the root stack (../docker-compose.yml) first; its postgres is the database.
  # Like the root backend service, the api applies migrations on startup (alembic upgrade head, DBOS system
  # tables, seed, prompt sync; all idempotent) and only then serves. The worker waits for the api to be healthy.
  api:
    <<: *backend
    command:
      - sh
      - -c
      - >-
        python -m mdcopilot_blog.cli migrate &&
        exec uvicorn --factory mdcopilot_blog.api.app:create_app --host 0.0.0.0 --port 8000 --no-proxy-headers
    # No host port: mdcopilot-backend is the only caller, over the shared network as http://blog-api:8000.
    networks:
      default:
        aliases: [blog-api]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *backend
    command: [python, -m, mdcopilot_blog.worker]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

# Join the root stack network (project "mdcopilot") so "postgres" resolves to the backend database.
networks:
  default:
    name: mdcopilot_mdcopilot-network
    external: true
