# Research discovery themes. Verified 2026-09-17.
# Edits after seeding happen in the Sources page; seeding never updates existing rows.
themes:
  - key: ai_news
    name: AI news
    description: Notable artificial intelligence news relevant to medicine.
    query_templates:
      - artificial intelligence news healthcare {month_year}
      - major AI announcements this week medicine
    pillar_keys: [D, NARRATIVE]
  - key: healthcare_ai
    name: Healthcare AI
    description: AI deployments and results inside health systems.
    query_templates:
      - healthcare AI deployment hospitals {month_year}
      - health system artificial intelligence adoption results
    pillar_keys: [B, D, E]
  - key: physician_workflow
    name: Physician workflow
    description: How AI changes the daily work of physicians.
    query_templates:
      - physician workflow AI tools clinical documentation
      - AI in specialist clinic workflow {month_year}
    pillar_keys: [B, C]
  - key: specialist_shortages
    name: Specialist shortages
    description: Shortages of specialist physicians and their causes.
    query_templates:
      - specialist physician shortage {month_year}
      - specialty care workforce shortage data
    pillar_keys: [A]
  - key: access_problems
    name: Access problems
    description: Patient access to specialist care, wait times and regional gaps.
    query_templates:
      - specialist appointment wait times patients
      - patient access to specialty care rural {month_year}
    pillar_keys: [A]
  - key: agentic_ai
    name: Agentic AI
    description: AI agents that act inside clinical and operational workflows.
    query_templates:
      - agentic AI healthcare workflows
      - AI agents clinical operations {month_year}
    pillar_keys: [D]
  - key: clinical_ai_research
    name: Clinical AI research
    description: Peer-reviewed and preprint research on clinical AI.
    query_templates:
      - clinical study artificial intelligence physicians results {month_year}
      - randomized trial AI clinical decision support
    pillar_keys: [B, E]
  - key: regulation
    name: Regulation
    description: FDA, CMS, HHS and ONC actions that govern clinical AI.
    query_templates:
      - FDA AI medical device guidance {month_year}
      - CMS HHS artificial intelligence policy rule
    pillar_keys: [E]
  - key: workforce_trends
    name: Workforce trends
    description: Physician and clinician workforce data and trends.
    query_templates:
      - physician workforce trends report {month_year}
      - clinician staffing survey AI
    pillar_keys: [A, C]
  - key: ai_model_developments
    name: AI model developments
    description: New model releases and capabilities relevant to medicine.
    query_templates:
      - new large language model release medical {month_year}
      - AI model benchmark clinical reasoning
    pillar_keys: [B, D]
  - key: digital_twins
    name: Digital twins
    description: Digital twins of patients, physicians and care processes.
    query_templates:
      - digital twin healthcare patient model
      - physician digital twin AI {month_year}
    pillar_keys: [D, NARRATIVE]
  - key: clinical_reasoning_systems
    name: Clinical reasoning systems
    description: Systems that model or support diagnostic and clinical reasoning.
    query_templates:
      - AI clinical reasoning diagnosis study
      - large language model diagnostic accuracy physicians {month_year}
    pillar_keys: [B]
  - key: automation
    name: Automation
    description: Automation of administrative and operational healthcare work.
    query_templates:
      - healthcare administrative automation AI {month_year}
      - prior authorization automation artificial intelligence
    pillar_keys: [C, D]
  - key: burnout
    name: Burnout
    description: Physician burnout, its drivers and interventions.
    query_templates:
      - physician burnout survey {month_year}
      - clinician burnout electronic health record inbox
    pillar_keys: [C]
  - key: administrative_overload
    name: Administrative overload
    description: Documentation, inbox and portal-message load on clinicians.
    query_templates:
      - physician administrative burden documentation time
      - patient portal message volume physicians {month_year}
    pillar_keys: [C]
