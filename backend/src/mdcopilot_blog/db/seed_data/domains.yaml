  - {domain: nih.gov, tier: 1, source_type: government, publisher: National Institutes of Health, verification_allowlisted: true, fetch_policy: metadata_only, notes: "Cloudflare challenge to direct fetch (2026-09-17)"}
  - {domain: healthit.gov, tier: 1, source_type: government, publisher: ASTP/ONC, verification_allowlisted: true}
