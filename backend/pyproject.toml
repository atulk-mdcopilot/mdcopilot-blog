[project]
name = "mdcopilot-blog-backend"
version = "0.1.0"
description = "MDCopilot Blog Intelligence backend (API, worker, CLI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.53.0,<0.54",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "psycopg[binary]>=3.3.5,<3.4",
    "alembic>=1.20.0,<1.21",
    "pgvector>=0.5.0,<0.6",
    "pydantic>=2.13.5,<2.14",
    "pydantic-settings>=2.15.0,<2.16",
    "pwdlib[argon2]>=0.3.1,<0.4",
    "httpx[http2]>=0.28.1,<0.29",
    "httpx2>=2.13.0,<2.14",
    "jinja2>=3.1.6,<3.2",
    "pyyaml>=6.0.3,<7",
    "uuid-utils>=1.0.0,<2",
    "dbos==3.0.0",
    "pydantic-ai-slim[openai,google,anthropic]>=2.43.0,<2.44",
    "genai-prices==0.1.7",
    "feedparser>=6.0.14,<7",
    "trafilatura>=2.2.0,<2.3",
    "htmldate>=1.10.0,<1.11",
    "newspaper4k>=0.9.6,<0.10",
    "pypdfium2>=5.13.0,<5.14",
    "protego>=0.6.2,<0.7",
    "python-dateutil>=2.9.0.post0,<3",
    "markdown-it-py>=4.2.0,<4.3",
    "nh3>=0.3.7,<0.4",
    "opentelemetry-sdk>=1.44.0,<1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<1.45",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<1.5",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-PyYAML",
    "types-python-dateutil>=2.9.0.20260807",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdcopilot_blog"

# pytest 9 native TOML table (not [tool.pytest.ini_options])
[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["live: calls real providers or external networks; runs only with BLOG_LIVE_TESTS=1"]
asyncio_mode = "auto"
# The engine fixtures are session-scoped, so fixtures AND tests must share the session loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
