[project]
name = "mdcopilot-blog-backend"
version = "0.1.0"
description = "MDCopilot Blog Intelligence backend (API, worker, CLI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.53.0,<0.54",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "psycopg[binary]>=3.3.5,<3.4",
    "alembic>=1.20.0,<1.21",
    "pydantic>=2.13.5,<2.14",
    "pydantic-settings>=2.15.0,<2.16",
    "httpx[http2]>=0.28.1,<0.29",
    "httpx2>=2.13.0,<2.14",
    "jinja2>=3.1.6,<3.2",
    "pyyaml>=6.0.3,<7",
    "uuid-utils>=1.0.0,<2",
    "dbos==3.0.0",
    "pydantic-ai-slim[openai,google,anthropic]>=2.43.0,<2.44",
    "genai-prices==0.1.7",
    "trafilatura>=2.2.0,<2.3",
    "htmldate>=1.10.0,<1.11",
    "newspaper4k>=0.9.6,<0.10",
    "pypdfium2>=5.13.0,<5.14",
    "protego>=0.6.2,<0.7",
    "markdown-it-py>=4.2.0,<4.3",
    "nh3>=0.3.7,<0.4",
    "langfuse>=4.15,<5",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdcopilot_blog"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
